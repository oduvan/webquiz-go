name: Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    # The Go "web" package embeds web/dist, so the pages must be built first.
    - name: Build web app
      run: |
        npm --prefix web ci
        npm --prefix web run build

    - name: go vet
      run: go vet ./...

    - name: gofmt
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    # The migration check test is skipped here: it has its own step below.
    - name: go test -race
      run: go test -race ./...

    - name: Migration check (every Python test id is ported)
      run: WEBQUIZ_REQUIRE_ALL_PORTED=1 go test ./migration/

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm --prefix web ci

    - name: Type check
      run: npm --prefix web run typecheck

    - name: Unit tests (Vitest)
      run: npm --prefix web test

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          web/package-lock.json
          e2e/package-lock.json

    # The Playwright global setup builds the web pages and the Go binary.
    - name: Install e2e dependencies
      run: npm --prefix e2e ci

    - name: Install Playwright browser
      working-directory: e2e
      run: npx playwright install --with-deps chromium

    - name: Playwright tests
      run: npm --prefix e2e test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 7

  harness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # The harness is added in a later task. Until harness/package.json exists
    # there is nothing to test.
    - name: Harness check tests
      run: |
        if [ -f harness/package.json ]; then
          npm --prefix harness ci
          npm --prefix harness test
        else
          echo "No harness/package.json yet, skipping."
        fi
